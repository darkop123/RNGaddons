name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archfiend-slots2/archfiend-slots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Selbsttest der Logik
        run: gradle selfTest --no-daemon
      - name: Mod bauen
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: archfiend-slots-jar
          path: archfiend-slots2/archfiend-slots/build/libs/archfiend-slots-1.0.0.jar
