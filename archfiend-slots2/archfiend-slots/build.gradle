plugins {
	// Neues Plugin fuer nicht-obfuskierte Versionen (Minecraft 26.1+)
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom fuegt Mojang- und Fabric-Repositories selbst hinzu.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Ab 26.1: kein "modImplementation" mehr, normale Konfigurationen.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name
	from("LICENSE") {
		rename { "${it}_${inputs.properties.projectName}" }
	}
}

// Selbsttest der reinen Logik (Parser, Zustandsautomat, Gewinnbetraege, Timeline).
// Die Testklassen benutzen kein Minecraft und laufen auch mit "javac"/"java" allein.
tasks.register('selfTest', JavaExec) {
	group = 'verification'
	description = 'Fuehrt den Selbsttest der reinen Logik aus.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.archfiendslots.SelfTest'
}
